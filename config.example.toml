# termi configuration
#
# Copy to <config-dir>/termi/config.toml and delete what you do not want to
# change — every key is optional and falls back to the value shown here.
#
#   Linux    ~/.config/termi/config.toml
#   macOS    ~/Library/Application Support/termi/config.toml
#   Windows  %APPDATA%\termi\config.toml
#
# Set TERMI_CONFIG_DIR to override the location entirely.
#
# Unknown keys are an error rather than a silent no-op, so a typo is reported
# in the command bar the next time termi starts.

# "dark", "light", or the stem of a file in <config-dir>/termi/themes/.
theme = "dark"
transparent_background = false # let the terminal's background show through

# Indentation.
tab_width = 4
expand_tabs = true       # insert spaces rather than a tab character
auto_indent = true       # carry indentation onto new lines, dedent on `}`
auto_pairs = true        # close brackets and quotes as they are typed

# Gutter.
line_numbers = true
relative_line_numbers = false
sign_column = true       # a column for git and diagnostic signs
git = true               # mark lines changed since the last commit, show the branch

# Language servers start on their own for the languages they serve, when the
# program is installed: rust-analyzer, clangd, pylsp, gopls,
# typescript-language-server, zls, lua-language-server and others.
lsp = true
auto_complete = true     # offer completions while typing, not only on Ctrl+Space

# Text area.
word_wrap = false        # wrap long lines instead of scrolling sideways
show_whitespace = false  # draw tabs and trailing spaces as visible marks
indent_guides = false    # faint rules at each indentation level
match_brackets = true    # highlight the bracket matching the one under the caret
minimap = false          # a miniature of the file beside each window
highlight_current_line = true
scrolloff = 3            # lines of context kept above and below the cursor
syntax_highlighting = true

# Chrome.
show_tabs = true         # tab strip, shown when more than one file is open

# Behaviour.
watch_files = true             # reload clean buffers and refresh the file tree
trim_trailing_whitespace = false
insert_final_newline = false   # end every file with a line break on save
detect_indent = true           # read each file's indentation from its contents
editorconfig = true            # honour the project's .editorconfig files
system_clipboard = true        # false uses an internal register instead

# Safety.
swap_files = true              # keep unsaved changes for :recover after a crash
large_file_mb = 16             # bigger files open without highlighting

# Sessions: reopen this directory's files and windows when started bare.
restore_session = true

# Undo.
undo_limit = 1000              # states kept per buffer
persistent_undo = true         # keep each file's undo history across restarts

# Let the mouse place the caret, select by dragging, and focus and scroll
# windows. Capturing the mouse takes drag-to-select away from the terminal
# itself; most terminals still offer that under Shift, but set this to false to
# leave the mouse alone entirely.
mouse = true

# Key mappings, one table per mode: normal, insert and visual. Keys are written
# the way the help writes them — <C-s>, <A-x>, <Space>f, <CR>, jk — and map to
# an action name (:help lists them), a :command, or other keys to type.
#
# [keys.normal]
# "<Space>f" = "file_picker"
# "<Space>w" = ":w"
# "<C-o>" = "jump_back"
#
# [keys.insert]
# jk = "normal_mode"

# Settings for one language, keyed by the name the status bar shows. The
# file's own .editorconfig and indentation still win over these.
#
# [languages.python]
# tab_width = 4
# trim_trailing_whitespace = true
# language_server = { command = "pyright-langserver", args = ["--stdio"] }
# formatter = "black --quiet -"   # :format pipes the file through this
#
# [languages.go]
# expand_tabs = false
