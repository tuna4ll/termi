name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token can write to the repository; nothing here needs to.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI. They are not locally, so this is the thing that
  # stops them accumulating.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Benchmarks are not run here — shared runners are too noisy for the
      # numbers to mean anything — but they have to keep compiling.
      - run: cargo bench --no-run

  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # Fuzzing itself needs nightly and hours; checking that the targets
      # still build against the library is what keeps them usable.
      - run: cargo check --manifest-path fuzz/Cargo.toml

  test:
    name: test (${{ matrix.os }})
    # Every platform is worth running: key events, the clipboard backend and
    # the file watcher are all implemented differently per OS, so a green run
    # on Linux says nothing about Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--locked` fails instead of silently updating Cargo.lock, so CI tests
      # the dependency versions the repository actually pins.
      - run: cargo test --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Kept in step with `rust-version` in Cargo.toml. Nothing else catches a
      # newly used language feature raising the real minimum.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
